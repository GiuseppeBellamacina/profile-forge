# Drop this into <your-login>/<your-login>/.github/workflows/profile-forge.yml
name: profile-forge

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: GiuseppeBellamacina/profile-forge@v1
        with:
          # Optional: a classic PAT (read:user + repo) to count private contributions.
          token: ${{ secrets.PROFILE_FORGE_TOKEN || github.token }}
          output_dir: assets
          # Everything else lives in config.json at the root of this repo (see README).

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile card" && git pull --rebase && git push)
